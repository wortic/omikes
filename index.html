<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omikes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0d0d0d;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .center-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px 60px;
      z-index: 2;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
    }

    .logo {
      width: 260px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .logo path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 3s ease-out forwards;
    }

    .logo text {
      opacity: 0;
      animation: fadeInText 3s ease-out 2.5s forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes fadeInText {
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="logo-anim" width="400" height="120" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;"></canvas>

  <div class="center-box">
    <svg class="logo" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lineGrad2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#7C4DFF" />
          <stop offset="100%" stop-color="#00E5FF" />
        </linearGradient>
        <filter id="glow2">
          <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#00E5FF" flood-opacity="0.5" />
        </filter>
      </defs>
      <text x="100" y="115" fill="#00E5FF" font-size="28" font-family="Consolas, monospace" letter-spacing="4">
        OMIKES
      </text>
    </svg>
  </div>

  <script>
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    let width, height;
    let forming = false;
    const polyhedra = [];
    const mouse = { x: 0, y: 0 };
    const targetPoints = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < 200; i++) {
      polyhedra.push({
        x: Math.random() * width,
        y: Math.random() * height,
        z: Math.random() * 200 + 100,
        size: Math.random() * 10 + 5,
        speed: Math.random() * 0.5 + 0.5,
        angle: Math.random() * Math.PI * 2,
        sides: Math.floor(Math.random() * 5 + 3),
        baseAngle: 0,
        orbitRadius: Math.random() * 20 + 10,
        tx: null,
        ty: null
      });
    }

    document.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    document.addEventListener("keydown", e => {
      if (!forming) {
        forming = true;
        const chars = e.key.toUpperCase();
        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d");
        tempCanvas.width = 200;
        tempCanvas.height = 100;
        tempCtx.fillStyle = "white";
        tempCtx.font = "bold 80px Segoe UI";
        tempCtx.fillText(chars, 10, 80);

        const imageData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
        targetPoints.length = 0;

        const offsetX = Math.random() * (width - 200);
        const offsetY = Math.random() * (height - 100);

        for (let y = 0; y < imageData.height; y += 4) {
          for (let x = 0; x < imageData.width; x += 4) {
            const index = (y * imageData.width + x) * 4;
            if (imageData.data[index + 3] > 128) {
              targetPoints.push({
                x: offsetX + x,
                y: offsetY + y
              });
            }
          }
        }

        polyhedra.forEach((p, i) => {
          if (i < targetPoints.length) {
            p.tx = targetPoints[i].x;
            p.ty = targetPoints[i].y;
          }
        });

        setTimeout(() => {
          forming = false;
          polyhedra.forEach(p => {
            p.tx = null;
            p.ty = null;
          });
        }, 5000);
      }
    });

    function drawPolyhedron(p) {
      const perspective = 300 / (p.z + 300);
      const px = (p.x - width / 2) * perspective + width / 2;
      const py = (p.y - height / 2) * perspective + height / 2;
      const s = p.size * perspective;

      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(p.angle);
      ctx.beginPath();
      for (let i = 0; i < p.sides; i++) {
        const theta = (i / p.sides) * 2 * Math.PI;
        const x = s * Math.cos(theta);
        const y = s * Math.sin(theta);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = "rgba(0,255,255,0.25)";
      ctx.stroke();
      ctx.restore();
    }

    function animate() {
      ctx.fillStyle = "rgba(13,13,13,0.35)";
      ctx.fillRect(0, 0, width, height);

      for (let p of polyhedra) {
        if (p.tx !== null && p.ty !== null) {
          p.x += (p.tx - p.x) * 0.05;
          p.y += (p.ty - p.y) * 0.05;
        } else {
          p.baseAngle += 0.002 * p.speed;
          p.x += Math.cos(p.angle + p.baseAngle) * p.speed;
          p.y += Math.sin(p.angle + p.baseAngle) * p.speed;

          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100) {
            p.x += dx / dist * 2;
            p.y += dy / dist * 2;
          }

          if (p.x < -50 || p.x > width + 50 || p.y < -50 || p.y > height + 50) {
            p.x = Math.random() * width;
            p.y = Math.random() * height;
            p.angle = Math.random() * Math.PI * 2;
            p.z = Math.random() * 200 + 100;
          }
        }

        drawPolyhedron(p);
      }
      requestAnimationFrame(animate);
    }

    animate();

    // Dynamic polygonal morph
    const logoCanvas = document.getElementById("logo-anim");
    const lctx = logoCanvas.getContext("2d");

    let currentSides = 3;
    let nextSides = 6;
    let morphProgress = 0;

    function drawMorphPolygon() {
      lctx.clearRect(0, 0, 400, 120);
      const cx = 200, cy = 60;
      const radius = 40;
      const sides = Math.round(currentSides + (nextSides - currentSides) * morphProgress);

      lctx.beginPath();
      for (let i = 0; i < sides; i++) {
        const theta = (i / sides) * 2 * Math.PI;
        const x = cx + radius * Math.cos(theta);
        const y = cy + radius * Math.sin(theta);
        if (i === 0) lctx.moveTo(x, y);
        else lctx.lineTo(x, y);
      }
      lctx.closePath();
      lctx.strokeStyle = "rgba(0,255,255,0.3)";
      lctx.lineWidth = 2;
      lctx.stroke();

      morphProgress += 0.01;
      if (morphProgress >= 1) {
        morphProgress = 0;
        currentSides = nextSides;
        nextSides = Math.floor(Math.random() * 97 + 3);
      }

      requestAnimationFrame(drawMorphPolygon);
    }

    drawMorphPolygon();
  </script>
</body>
</html>
