<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omikes</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0b0c10;
      font-family: 'Segoe UI', sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .center-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      z-index: 2;
      overflow: hidden;
    }

    .logo {
      font-size: 3em;
      font-weight: bold;
      color: #000;
      margin-bottom: 20px;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div class="center-box">
    <div class="logo">Omikes</div>
  </div>

  <script>
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");
    let w = canvas.width = window.innerWidth;
    let h = canvas.height = window.innerHeight;

    const polygons = [];
    const keys = [];

    class Polygon {
      constructor(x, y, sides, size) {
        this.x = x;
        this.y = y;
        this.sides = sides;
        this.size = size;
        this.angle = Math.random() * 2 * Math.PI;
        this.speed = 0.1 + Math.random() * 1;
        this.dx = Math.cos(this.angle) * this.speed;
        this.dy = Math.sin(this.angle) * this.speed;
        this.target = null;
        this.timeout = null;
      }

      update() {
        if (this.target) {
          const dx = this.target.x - this.x;
          const dy = this.target.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist > 2) {
            this.x += dx * 0.1;
            this.y += dy * 0.1;
          }
        } else {
          const dx = this.x - mouse.x;
          const dy = this.y - mouse.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100) {
            this.x += dx * 0.1;
            this.y += dy * 0.1;
          } else {
            this.x += this.dx;
            this.y += this.dy;
          }
        }

        if (this.x > w) this.x = 0;
        if (this.x < 0) this.x = w;
        if (this.y > h) this.y = 0;
        if (this.y < 0) this.y = h;
      }

      draw() {
        ctx.beginPath();
        for (let i = 0; i < this.sides; i++) {
          const angle = (i / this.sides) * 2 * Math.PI;
          const px = this.x + this.size * Math.cos(angle);
          const py = this.y + this.size * Math.sin(angle);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.strokeStyle = "#1f3a93";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    const mouse = { x: -1000, y: -1000 };
    document.addEventListener("mousemove", e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function initPolygons(n = 100) {
      polygons.length = 0;
      for (let i = 0; i < n; i++) {
        const p = new Polygon(Math.random() * w, Math.random() * h, 3 + Math.floor(Math.random() * 5), 4 + Math.random() * 6);
        polygons.push(p);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      for (let p of polygons) {
        p.update();
        p.draw();
      }
      requestAnimationFrame(draw);
    }

    function letterFormation(letter) {
      const fontSize = 200;
      const tempCanvas = document.createElement("canvas");
      const tempCtx = tempCanvas.getContext("2d");
      tempCanvas.width = w;
      tempCanvas.height = h;
      tempCtx.font = `${fontSize}px Segoe UI`;
      tempCtx.fillStyle = "white";
      const x = Math.random() * (w - fontSize * 2);
      const y = Math.random() * (h - fontSize);
      tempCtx.fillText(letter, x, y);
      const imageData = tempCtx.getImageData(0, 0, w, h);
      const data = imageData.data;
      const targets = [];

      for (let y = 0; y < h; y += 6) {
        for (let x = 0; x < w; x += 6) {
          const index = (y * w + x) * 4;
          if (data[index + 3] > 128) {
            targets.push({ x, y });
          }
        }
      }

      for (let i = 0; i < targets.length && i < polygons.length; i++) {
        polygons[i].target = targets[i];
      }

      clearTargetsAfterDelay();
    }

    function clearTargetsAfterDelay() {
      setTimeout(() => {
        polygons.forEach(p => p.target = null);
      }, 4000);
    }

    document.addEventListener("keydown", e => {
      keys.push(e.key);
      if (keys.slice(-2).join("") === "ml") {
        letterFormation("Hej!");
      } else {
        letterFormation(e.key.toUpperCase());
      }
    });

    window.addEventListener("resize", () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      initPolygons();
    });

    initPolygons();
    draw();
  </script>
</body>
</html>
